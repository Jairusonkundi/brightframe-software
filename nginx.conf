# ──────────────────────────────────────────────────────────────────────
# Security: Deny access to sensitive files
# ──────────────────────────────────────────────────────────────────────

location ~ /\.env {
    deny all;
    return 404;
}

location ~ /\.env\.example {
    deny all;
    return 404;
}

location ~ /\.git {
    deny all;
    return 404;
}

location ~* ^/(composer\.json|composer\.lock|phinx\.php)$ {
    deny all;
    return 404;
}

location ~* ^/(database\.sql|seed_data\.sql)$ {
    deny all;
    return 404;
}

location ~* ^/error\.log$ {
    deny all;
    return 404;
}

location ~* ^/(config|db|vendor|includes|handlers)/ {
    deny all;
    return 404;
}

# ──────────────────────────────────────────────────────────────────────
# Security Headers
# ──────────────────────────────────────────────────────────────────────

add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

# Hide server info
server_tokens off;
more_clear_headers "Server" "X-Powered-By";

# ──────────────────────────────────────────────────────────────────────
# Hide .php extensions
# ──────────────────────────────────────────────────────────────────────

# 1. External redirect: /foo.php → /foo/ (301)
#    Only for safe methods
location ~ \.php$ {
    # Block direct .php access for GET/HEAD — redirect to extensionless
    if ($request_method ~* ^(GET|HEAD)$) {
        rewrite ^/(.+)\.php$ /$1/ permanent;
    }
    # POST etc. fall through to PHP handler below
}

# 2. Homepage: /index.php → /
location = /index.php {
    if ($request_method ~* ^(GET|HEAD)$) {
        return 301 /;
    }
}

# 3. Internal rewrites: /foo/ → /foo.php (if file exists)
#    Root-level pages
location ~ ^/([^/]+)/$ {
    try_files $uri $uri/ /$1.php =404;
}

# 4. Services category pages: /services/slug/ → /services/slug.php
location ~ ^/services/(.+)/$ {
    try_files $uri $uri/ /services/$1.php =404;
}

# 5. Admin pages: /admin/page/ → /admin/page.php
location ~ ^/admin/(.+)/$ {
    try_files $uri $uri/ /admin/$1.php =404;
}

# 6. Add trailing slash for clean URLs (only when .php exists)
location / {
    try_files $uri $uri/ =404;
}

# ──────────────────────────────────────────────────────────────────────
# Caching for static assets
# ──────────────────────────────────────────────────────────────────────

location ~* \.(svg|svgz|png|jpg|jpeg|webp|css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.(json)$ {
    expires off;
    add_header Cache-Control "no-store";
}

# ──────────────────────────────────────────────────────────────────────
# MIME types
# ──────────────────────────────────────────────────────────────────────

types {
    image/svg+xml svg svgz;
}